name: Canlı model verisi
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"   # her pazartesi 06:41, yeni biten maçları ekler
permissions:
  contents: write
jobs:
  canli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        timeout-minutes: 5
      - run: python src/live_collect.py --days 10 --max 600
      - run: python src/live_backtest.py
      - run: |
          git config user.name "analiz-bot"
          git config user.email "analiz-bot@users.noreply.github.com"
          git add -f data/live docs/data/live_params.json docs/data/live_test.json || true
          git commit -m "Canlı model verisi" || true
          git pull --rebase origin main && git push
