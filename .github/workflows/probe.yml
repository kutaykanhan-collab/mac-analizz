name: Kaynak testi
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/probe.py
      - run: |
          git config user.name "analiz-bot"
          git config user.email "analiz-bot@users.noreply.github.com"
          git add docs/data/probe.json data/raw/probe_*
          git commit -m "Kaynak testi" || true
          git pull --rebase origin main && git push
